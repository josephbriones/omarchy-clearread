name: Bug report
description: Report a reproducible ClearRead problem without private content.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use generated sample text. Do not attach a private screenshot, clipboard payload, or OCR result.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      placeholder: Describe the expected and observed behavior.
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Capture path
      options:
        - Demo
        - Active window
        - Screen area
        - Clipboard
        - Reader only
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction with non-sensitive text
      placeholder: Numbered steps using generated fixture text.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ClearRead version or commit
      placeholder: 0.1.0 or a full commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Omarchy version, display count/scales, OCR language, and relevant tool versions.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private screen, clipboard, path, device, and recognized-text data.
          required: true
